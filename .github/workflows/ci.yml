name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features --workspace
      - name: 6000-file performance budgets
        run: cargo bench -p unstave-core --bench pipeline
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: enable pnpm
        run: corepack enable
      - name: install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: build native binding and Vite plugin
        run: pnpm --filter unstave build && pnpm --filter vite-plugin-unstave build
      - name: test JavaScript packages
        run: pnpm test
