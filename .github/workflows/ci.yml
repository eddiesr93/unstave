name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features --workspace
      - name: 6000-file performance budgets
        run: cargo bench -p unstave-core --bench pipeline
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: enable pnpm
        run: corepack enable
      - name: install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: lint JavaScript
        run: pnpm lint
      - name: build native binding and Vite plugin
        run: pnpm --filter @unstave/node build && pnpm --filter @unstave/vite-plugin build
      - name: test JavaScript packages
        run: pnpm test
      - name: audit JavaScript dependencies
        run: pnpm audit

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: x86_64-pc-windows-msvc
      - name: Enable pnpm
        run: corepack enable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native binding
        shell: bash
        run: >-
          pnpm --filter @unstave/node exec napi build
          --release
          --platform
          --target x86_64-pc-windows-msvc
          --manifest-path ../../crates/unstave-napi/Cargo.toml
          --output-dir .
          --no-js
          --dts native.d.ts
      - name: Test native binding
        run: pnpm --filter @unstave/node test
      - name: Test Rust graph analyses (regression includeTypeEdges)
        run: cargo test -p unstave-core --test graph_analyses type_only_reexport_module_enters_fan_in_only_with_type_edges

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          alert-limit: 10
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
