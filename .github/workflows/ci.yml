name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features --workspace
      - name: 6000-file performance budgets
        run: cargo bench -p unstave-core --bench pipeline
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: enable pnpm
        run: corepack enable
      - name: install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: lint JavaScript
        run: pnpm lint
      - name: build native binding and Vite plugin
        run: pnpm --filter @unstave/node build && pnpm --filter @unstave/vite-plugin build
      - name: test JavaScript packages
        run: pnpm test
      - name: audit JavaScript dependencies
        run: pnpm audit

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          alert-limit: 10
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
