title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Start with the workflow problem and a concrete example. A discussion can become an implementation issue after its scope and tradeoffs are clear.

  - type: dropdown
    id: surface
    attributes:
      label: Product area
      options:
        - CLI
        - Core analysis
        - HTML, JSON, or terminal report
        - Codemod
        - Node API
        - Vite plugin
        - Documentation
        - Installation or release
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What is difficult today, and who encounters it?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or result without prescribing an implementation.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Concrete example
      description: Add a command, configuration, module layout, or proposed output that makes the need clear.
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives and tradeoffs
      description: What workarounds or related tools have you tried, and what should unstave avoid?

  - type: dropdown
    id: contribution
    attributes:
      label: How can you help?
      options:
        - I can open a pull request with guidance
        - I can provide a public fixture or validate an implementation
        - I am sharing the need only
    validations:
      required: true
