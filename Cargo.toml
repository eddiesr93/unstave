[workspace]
resolver = "2"
members = [
    "crates/unstave-core",
    "crates/unstave-report",
    "crates/unstave-codemod",
    "crates/unstave-napi",
    "crates/unstave-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/eddiesr93/unstave"
homepage = "https://github.com/eddiesr93/unstave"
readme = "README.md"
keywords = ["typescript", "barrel", "imports", "monorepo", "codemod"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.82"

[workspace.dependencies]
unstave-core = { path = "crates/unstave-core", version = "0.1.2" }
unstave-report = { path = "crates/unstave-report", version = "0.1.2" }
unstave-codemod = { path = "crates/unstave-codemod", version = "0.1.2" }
unstave-napi = { path = "crates/unstave-napi", version = "0.1.2" }

# oxc crates release in lockstep — keep this single version pinned across the workspace.
oxc_allocator = "=0.143.0"
oxc_ast = "=0.143.0"
oxc_ast_visit = "=0.143.0"
oxc_parser = "=0.143.0"
oxc_span = "=0.143.0"
oxc_resolver = "11.24"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1.10"
dashmap = "6"
petgraph = "0.8"
fixedbitset = "0.5"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
owo-colors = "4"
toml = "0.8"
globset = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
insta = { version = "1", features = ["json", "filters"] }
similar = "2.7"
json-strip-comments = "3.1"
napi = { version = "3.12.0", default-features = false, features = ["napi6", "async", "serde-json", "dyn-symbols"] }
napi-derive = "3.6.2"
napi-build = "2.4.0"
rkyv = "0.8.18"

[profile.release]
lto = "thin"
codegen-units = 1
